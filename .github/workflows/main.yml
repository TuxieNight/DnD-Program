name: Build and Deploy Java Game to Pages

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master
  workflow_dispatch: # Allows you to trigger a deploy manually from the Actions tab

# Required permissions to deploy directly to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents overlapping deployments if you push multiple times quickly
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAR_NAME: my-game.jar
      MAIN_CLASS: com.example.Main # <-- REPLACE with your actual main class
      SRC_DIR: src                  # <-- Folder containing your .java files
      RES_DIR: res                  # <-- Optional: folder with images/sounds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 8 JDK
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Compile and package JAR
        run: |
          mkdir -p build
          find "$SRC_DIR" -name "*.java" > sources.txt
          javac -d build @sources.txt

          # Copy assets into build/ if the resource folder exists
          if [ -d "$RES_DIR" ]; then
            cp -r "$RES_DIR"/* build/
          fi

          jar cfe "$JAR_NAME" "$MAIN_CLASS" -C build .

      - name: Assemble Pages site folder
        run: |
          mkdir -p _site
          cp index.html "$JAR_NAME" _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
